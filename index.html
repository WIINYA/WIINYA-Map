<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,

	overflow: hidden;
	}

.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;

	}
.leaflet-marker-icon,

	}

.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {

.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

.leaflet-container {

	}
.leaflet-container a {

.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;

	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	display: block;
	text-align: center;

.leaflet-bar a,

.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {

	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {

	background-color: #f4f4f4;

	}

.leaflet-touch .leaflet-bar a {

.leaflet-touch .leaflet-bar a:first-child {

.leaflet-touch .leaflet-bar a:last-child {

	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {

.leaflet-retina .leaflet-control-layers-toggle {

.leaflet-touch .leaflet-control-layers-toggle {

.leaflet-control-layers .leaflet-control-layers-list,

.leaflet-control-layers-expanded .leaflet-control-layers-list {

.leaflet-control-layers-scrollbar {

	}
.leaflet-control-layers label {

	}
.leaflet-control-layers-separator {

/* Default icon URLs */

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-left .leaflet-control-scale {

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;

.leaflet-popup-content-wrapper {

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;

	border: 6px solid transparent;

	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	}
.leaflet-tooltip-top:before {

}

}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

<style>
:root{
  --ink:#1b211f; --muted:#5c635f; --paper:#f6f5f1; --line:#dcd7cb;
  --panel: rgba(255,255,255,.97);
  --mono:"Consolas","SF Mono","Menlo","DejaVu Sans Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;z-index:1000}
header h1{font-size:16px;font-weight:650;margin:0;letter-spacing:.2px}
header h1 span{color:var(--muted);font-weight:500}
.search{margin-left:auto;display:flex;align-items:center;gap:8px}
.search input{font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;width:230px;background:#fff;color:var(--ink)}
.search input:focus{outline:2px solid #b7c2bd;border-color:#b7c2bd}
.count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#map{flex:1;min-height:0}
/* markers */
.pin-wrap{background:none;border:none}
.pin{display:block;width:15px;height:15px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.35)}
/* legend */
.legend{position:absolute;left:14px;bottom:22px;z-index:1000;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px 13px;min-width:190px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12.5px}
.legend .lt{font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 8px}
.legend .jump{display:flex;gap:6px;margin-bottom:10px}
.legend .jump button{flex:1;font-family:var(--sans);font-size:11.5px;padding:5px 8px;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink)}
.legend .jump button:hover{background:#eef0ed}
.legend .row{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;cursor:pointer}
.legend .row:hover{background:#eef0ed}
.legend .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);flex:none}
.legend .nm{flex:1}
.legend .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.legend .hint{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.4}
.legend .pxkey{margin-top:9px;border-top:1px solid var(--line);padding-top:9px;display:flex;gap:12px;font-size:11px;color:var(--muted)}
.legend .pxkey b{font-weight:600;color:var(--ink)}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* popup */
.leaflet-popup-content{margin:0;line-height:1.45}
.leaflet-popup-content-wrapper{border-radius:11px;padding:0;overflow:hidden}
.card{font-size:13px}
.card .hd{padding:11px 13px 9px;border-bottom:1px solid var(--line)}
.card .nm{font-size:15px;font-weight:650;margin:0 0 5px;line-height:1.25}
.card .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.state{font-size:10.5px;font-weight:650;color:#fff;padding:2px 7px;border-radius:20px;letter-spacing:.3px}
.code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.card .bd{padding:11px 13px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 2px}
.fl{color:var(--muted);font-size:11.5px}
.fv{font-size:12.5px}
.fv.mono{font-family:var(--mono);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.chip{font-size:10.5px;font-family:var(--mono);padding:2px 7px;border-radius:5px;letter-spacing:.2px}
.chip.yes{background:#e4f2e9;color:#1f7a43;border:1px solid #bfe0cd}
.chip.pend{background:#fbf1df;color:#9a6512;border:1px solid #ecd6ab}
.chip em{font-style:normal;opacity:.7;margin-left:3px}
.pxhdr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:11px 0 0}
.notes{margin:10px 0 0;padding:8px 10px;background:#f4f3ee;border-radius:7px;font-size:12px;color:#3c423f}
.folder{margin-top:9px;font-size:11px;color:var(--muted)}
.folder code{font-family:var(--mono);background:#f2f1ec;padding:1px 5px;border-radius:4px}
.actions{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font-size:12.5px;font-weight:550;padding:7px 12px;border-radius:7px;text-decoration:none;display:inline-block}
a.btn{background:#1f7a43;color:#fff}
a.btn:hover{background:#1a6a3a}
.btn.disabled{background:#eceae4;color:#8b908c;cursor:default}
.dbbadge{font-size:10.5px;font-family:var(--mono);padding:3px 8px;border-radius:5px;background:#eef0f2;
  border:1px solid var(--line);color:#41504a;text-decoration:none}
a.dbbadge:hover{background:#e7ecff}
details.clim{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
details.clim summary{cursor:pointer;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;list-style:none}
details.clim summary::-webkit-details-marker{display:none}
details.clim summary:before{content:"▸ ";}
details.clim[open] summary:before{content:"▾ ";}
.climgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:8px;font-size:11px}
.climgrid .ck{color:var(--muted)}
.climgrid .cv{font-family:var(--mono);text-align:right}
@media (max-width:560px){
  .search input{width:150px}
  header h1{font-size:14px}
  .legend{bottom:14px;left:10px;min-width:170px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
:root{--vline:#e7e6e1;--vmuted:#6c6b64;--vink:#1b1b19;}
body[data-theme=dark]{--vline:#33332f;--vmuted:#9a998f;--vink:#f4f4ef;}
.vbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.vbtn{font-family:var(--sans,system-ui);font-size:12px;font-weight:550;padding:6px 10px;border-radius:7px;
  border:1px solid #bfe0cd;background:#e4f2e9;color:#1f7a43;cursor:pointer}
.vbtn:hover{background:#d3ebdd}
#vizOverlay{position:fixed;inset:0;z-index:5000;background:rgba(20,22,20,.44);display:none;align-items:center;justify-content:center}
.vizModal{background:#fdfdfb;color:var(--vink);width:min(1120px,94vw);max-height:92vh;border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;font-family:var(--sans,system-ui)}
body[data-theme=dark] .vizModal{background:#1c1c1a}
.vizHd{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--vline)}
.vizHd h2{margin:0;font-size:17px;font-weight:660}
.vizHd .sub{font-size:12.5px;color:var(--vmuted);margin-top:2px}
.vizHd .sp{flex:1}
.vizHd button{font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--vline);
  background:#f2f1ec;color:var(--vink);cursor:pointer}
body[data-theme=dark] .vizHd button{background:#2a2a27}
.vizHd .x{font-size:20px;line-height:1;padding:2px 10px}
.vizBody{padding:16px 18px;overflow:auto}
#vizChart{position:relative;overflow:auto}
.vtip{position:absolute;pointer-events:none;background:#1b1b19;color:#fff;font-size:11.5px;padding:5px 8px;
  border-radius:6px;white-space:nowrap;z-index:10;display:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#vizTableWrap{max-height:70vh;overflow:auto}
#vizTableWrap table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
#vizTableWrap th,#vizTableWrap td{border:1px solid var(--vline);padding:3px 8px;text-align:right}
#vizTableWrap th{position:sticky;top:0;background:#f2f1ec}
body[data-theme=dark] #vizTableWrap th{background:#2a2a27}

</style>
</head><body>
<div id="vizOverlay" onclick="if(event.target===this)closeViz()">
  <div class="vizModal">
    <div class="vizHd">
      <div><h2 id="vizTitle">Site</h2><div class="sub" id="vizSub"></div></div>
      <div class="sp"></div>
      <button id="vizToggleAxis" onclick="toggleAxis()" style="display:none">Show vs depth</button>
      <button id="vizToggleTable" onclick="toggleTable()">Table view</button>
      <button class="x" onclick="closeViz()" title="Close">&times;</button>
    </div>
    <div class="vizBody">
      <div id="vizChart"></div>
      <div id="vizTableWrap" style="display:none"></div>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Palaeoecology core sites <span>&middot; 123 sites</span></h1>
    <div class="search">
      <input id="q" type="search" placeholder="Filter by name or core code…" autocomplete="off">
      <button id="clr" class="dbbadge" style="cursor:pointer">Clear</button>
      <span class="count" id="cnt">123 sites</span>
    </div>
  </header>
  <div id="map"></div>
</div>

function f(label,val,mono){return (val===null||val===undefined||val==='')?'':
  `<div class="fl">${label}</div><div class="fv${mono?' mono':''}">${esc(val)}</div>`;}


function papersBlock(r){
  if(typeof PAPERS==='undefined'||!r.code) return '';
  const seen={}, out=[];
  String(r.code).split(',').forEach(function(c){
    c=c.trim(); const list=PAPERS.byCode[c]; if(!list) return;
    list.forEach(function(fn){ if(seen[fn]) return; seen[fn]=1;
      const label=PAPERS.cite[fn]||fn;
      const doi=PAPERS.doi[fn];
      if(doi){
        const url='https://doi.org/'+doi;
        out.push('<a class="paperlink" href="'+url+'" target="_blank" rel="noopener">'+esc(label)+
                 '<span class="doi">doi.org/'+esc(doi)+' ↗</span></a>');
      } else {
        out.push('<span class="paperlink nodoi">'+esc(label)+'<span class="doi">no DOI</span></span>');
      }
    });
  });
  if(!out.length) return '';
  return '<div class="pxhdr">Papers ('+out.length+')</div><div class="papers">'+out.join('')+'</div>';
}
function popup(r){
  const lat=Math.abs(r.lat).toFixed(4)+'°S';
  const lon=Math.abs(r.lon).toFixed(4)+'°'+(r.lon<0?'W':'E');
  const chips=Object.entries(r.proxies).map(([k,v])=>{
    const yes=String(v).toUpperCase()==='YES';
    const tag=yes?'':`<em>${esc(v)}</em>`;
    return `<span class="chip ${yes?'yes':'pend'}">${esc(k)}${tag}</span>`;
  }).join('');
  let facts='';
  facts+=f('Coordinates',lat+', '+lon,true);
  facts+=f('Elevation', r.elev? (Math.round(parseFloat(r.elev))+' m') : null);
  facts+=f('Max depth', r.depth? (r.depth+' m') : null);
  facts+=f('Area', r.area? (parseFloat(r.area).toFixed(3)+' km\u00b2') : null);
  facts+=f('Perimeter', r.perim? (parseFloat(r.perim).toFixed(2)+' km') : null);
  facts+=f('Record', r.record? (Number(r.record).toLocaleString()+' yr') : null);
  facts+=f('Analyst', r.analyst);
  facts+=f('Publication', r.publication);
  let clim='';
  const bk=Object.keys(r.bio||{});
  if(bk.length){
    const rows=bk.map(k=>`<div class="ck">${esc(k)}</div><div class="cv">${r.bio[k]}</div>`).join('');
    clim=`<details class="clim"><summary>Climate envelope (${bk.length})</summary><div class="climgrid">${rows}</div></details>`;
  }
  return `<div class="card">
    <div class="hd">
      <div class="nm">${esc(r.name)}</div>
      <div class="meta">
        <span class="state" style="background:${COL[r.state]||'#555'}">${r.state}</span>
        ${r.code?`<span class="code">${esc(r.code)}</span>`:''}
      </div>
    </div>
    <div class="bd">
      <div class="facts">${facts}</div>
      ${chips?`<div class="pxhdr">Proxies</div><div class="chips">${chips}</div>`:''}
      ${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}
      ${papersBlock(r)}
      ${vizButtons(r.key)}
      ${clim}
    </div></div>`;
}

/* WIINYA visualiser UI */
/* ===== WIINYA data visualiser (self-contained, no external libs) ===== */
const PAL = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const DPAL= ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
function pal(i){ return (document.body.dataset.theme==='dark'?DPAL:PAL)[i%8]; }

let _axis='age'; // 'age' | 'depth'
function chronOf(site){
  const c=site&&site.datasets&&site.datasets.chronology;
  if(!c||!c.depths||!c.median) return null;
  const pts=c.depths.map((d,i)=>[d,c.median[i]]).filter(p=>p[0]!=null&&p[1]!=null).sort((a,b)=>a[0]-b[0]);
  if(pts.length<2) return null;
  return {ageAt:function(d){ if(d==null)return null;
    if(d<=pts[0][0])return pts[0][1]; if(d>=pts[pts.length-1][0])return pts[pts.length-1][1];
    for(let i=1;i<pts.length;i++){ if(d<=pts[i][0]){ const [d0,a0]=pts[i-1],[d1,a1]=pts[i]; return a0+(a1-a0)*(d-d0)/((d1-d0)||1);} }
    return pts[pts.length-1][1]; }};
}
// vertical coordinate array for a dataset given axis mode; returns {vals,label,ok}
function vaxis(ds,site){
  if(_axis==='age'){
    if(ds.ages){ return {vals:ds.ages,label:'Age (cal yr BP)',ok:true}; }
    const ch=chronOf(site); if(ch&&ds.depths){ return {vals:ds.depths.map(d=>ch.ageAt(d)),label:'Age (cal yr BP)',ok:true}; }
  }
  return {vals:ds.depths,label:'Depth (cm)',ok:false};
}

// human labels for dataset keys
const DSLABEL = {
  pollen_pct:'Pollen (%)', pollen_raw:'Pollen (raw counts)',
  charcoal_raw:'Macro charcoal (raw)', charcoal_char:'Charcoal accumulation (CHAR)',
  chronology:'Age–depth model', loi:'Loss on ignition', grainsize:'Grain size',
  geochem:'Geochemistry', diatoms:'Diatoms'
};
function dsLabel(k, ds){ return (ds&&ds.label) || DSLABEL[k] || k.replace(/_/g,' '); }

function vizButtons(key){
  const s = (window.SITEDATA||{})[key];
  if(!s || !s.datasets) return '';
  const btns = Object.keys(s.datasets).map(dk=>{
    const ds=s.datasets[dk];
    return `<button class="vbtn" onclick="openViz('${key}','${dk}')">${dsLabel(dk,ds)}</button>`;
  }).join('');
  return btns ? `<div class="pxhdr">Explore data</div><div class="vbtns">${btns}</div>` : '';
}

let _cur=null;
function openViz(key,dk){
  const s=window.SITEDATA[key]; const ds=s.datasets[dk];
  _cur={key,dk,ds,site:s};
  document.getElementById('vizTitle').textContent = (s.name||key);
  document.getElementById('vizSub').textContent = dsLabel(dk,ds) + (ds.unit? '  ·  '+ds.unit : '');
  const R=ds.render||''; const canToggle=(R==='strat'||R==='profile') && !!ds.depths && (!!ds.ages||!!chronOf(s)); _axis = ds.ages ? 'age' : 'depth';
  const ab=document.getElementById('vizToggleAxis');
  ab.style.display = canToggle ? 'inline-block':'none';
  ab.textContent = _axis==='age'?'Show vs depth':'Show vs age';
  const ov=document.getElementById('vizOverlay'); ov.style.display='flex';
  document.getElementById('vizTableWrap').style.display='none';
  document.getElementById('vizChart').style.display='block';
  document.getElementById('vizToggleTable').textContent='Table view';
  render();
}
function closeViz(){ document.getElementById('vizOverlay').style.display='none'; _cur=null; }

function render(){
  if(!_cur) return;
  const {ds}=_cur;
  const host=document.getElementById('vizChart'); host.innerHTML='';
  const R=ds.render || (ds.type==='chronology'?'chrono':(ds.type==='pollen'?'strat':'profile'));
  if(R==='chrono') host.appendChild(chartChrono(ds));
  else if(R==='dates') host.appendChild(chartDates(ds));
  else if(R==='line') host.appendChild(chartLineAny(ds,_cur.site));
  else if(R==='strat') host.appendChild(chartStrat(ds,_cur.site));
  else host.appendChild(chartProfile(ds,_cur.site));
}

// ---- helpers ----
const NS='http://www.w3.org/2000/svg';
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function ink(v){return getComputedStyle(document.body).getPropertyValue(v).trim();}
function extent(a){let mn=Infinity,mx=-Infinity;a.forEach(v=>{if(v!=null&&!isNaN(v)){if(v<mn)mn=v;if(v>mx)mx=v;}});return [mn,mx];}

// tooltip
let TT;
function tip(){ if(!TT){TT=document.createElement('div');TT.className='vtip';document.getElementById('vizChart').appendChild(TT);} return TT;}
function showTip(x,y,html){const t=tip();t.innerHTML=html;t.style.display='block';t.style.left=(x+14)+'px';t.style.top=(y+10)+'px';}
function hideTip(){if(TT)TT.style.display='none';}

// ---- Age-depth (chronology) : X=age, Y=depth inverted, band=min..max, line=median ----
function chartChrono(ds){
  const W=760,H=520,m={l:64,r:20,t:20,b:48};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const [amn,amx]=extent(ds.min.concat(ds.max,ds.median));
  const [dmn,dmx]=extent(ds.depths);
  const sx=a=>m.l+(a-amn)/(amx-amn||1)*iw;
  const sy=d=>m.t+(d-dmn)/(dmx-dmn||1)*ih; // depth increases downward
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-height:70vh'});
  // grid + axes
  axes(svg,m,iw,ih,amn,amx,dmn,dmx,'Age (cal yr BP)','Depth (cm)');
  // uncertainty band
  let up='',dn='';
  ds.depths.forEach((d,i)=>{ up+=(i?'L':'M')+sx(ds.min[i]).toFixed(1)+' '+sy(d).toFixed(1)+' '; });
  for(let i=ds.depths.length-1;i>=0;i--){ dn+='L'+sx(ds.max[i]).toFixed(1)+' '+sy(ds.depths[i]).toFixed(1)+' '; }
  svg.appendChild(el('path',{d:up+dn+'Z',fill:pal(0),opacity:.18,stroke:'none'}));
  // median line
  let md='';
  ds.depths.forEach((d,i)=>{ md+=(i?'L':'M')+sx(ds.median[i]).toFixed(1)+' '+sy(d).toFixed(1)+' '; });
  svg.appendChild(el('path',{d:md,fill:'none',stroke:pal(0),'stroke-width':2}));
  // hover
  const hit=el('rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent'});
  hit.addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect(); const py=(ev.clientY-r.top)/r.height*H;
    const d=dmn+(py-m.t)/ih*(dmx-dmn);
    let bi=0,bd=1e9; ds.depths.forEach((dd,i)=>{const e=Math.abs(dd-d);if(e<bd){bd=e;bi=i;}});
    showTip(ev.clientX-r.left+ (r.left-document.getElementById('vizChart').getBoundingClientRect().left),
            ev.clientY-r.top+ (r.top-document.getElementById('vizChart').getBoundingClientRect().top),
      `<b>${ds.depths[bi]} cm</b><br>median ${Math.round(ds.median[bi]).toLocaleString()} yr<br>`+
      `range ${Math.round(ds.min[bi]).toLocaleString()}–${Math.round(ds.max[bi]).toLocaleString()}`);
  });
  hit.addEventListener('mouseleave',hideTip);
  svg.appendChild(hit);
  legend(svg,W,m,[['median',pal(0)],['95% range',pal(0)]]);
  return svg;
}

// ---- Profile: series vs age/depth (Y inverted), X=value ----
function chartProfile(ds,site){
  const names=Object.keys(ds.series);
  const va=vaxis(ds,site); const yv=va.vals;
  const W=760,H=520,m={l:70,r:20,t:24,b:48};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const [dmn,dmx]=extent(yv.filter(x=>x!=null));
  let all=[]; names.forEach(n=>all=all.concat(ds.series[n]));
  const [vmn0,vmx]=extent(all); const vmn=Math.min(0,vmn0);
  const sx=v=>m.l+(v-vmn)/(vmx-vmn||1)*iw;
  const sy=d=>m.t+(d-dmn)/(dmx-dmn||1)*ih;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-height:70vh'});
  axes(svg,m,iw,ih,vmn,vmx,dmn,dmx,ds.unit||'value',va.label);
  names.forEach((n,si)=>{
    let p='';
    yv.forEach((d,i)=>{ const val=ds.series[n][i]; if(val==null||d==null)return; p+=(p?'L':'M')+sx(val).toFixed(1)+' '+sy(d).toFixed(1)+' '; });
    svg.appendChild(el('path',{d:p,fill:'none',stroke:pal(si),'stroke-width':2}));
    yv.forEach((d,i)=>{ const val=ds.series[n][i]; if(val==null||d==null)return;
      const c=el('circle',{cx:sx(val).toFixed(1),cy:sy(d).toFixed(1),r:3,fill:pal(si),stroke:'#fff','stroke-width':1});
      c.addEventListener('mousemove',ev=>{const r=document.getElementById('vizChart').getBoundingClientRect();
        showTip(ev.clientX-r.left,ev.clientY-r.top,`<b>${n}</b><br>${va.ok?Math.round(d).toLocaleString()+' yr':d+' cm'} · ${val}`);});
      c.addEventListener('mouseleave',hideTip); svg.appendChild(c);
    });
  });
  legend(svg,W,m,names.map((n,i)=>[n,pal(i)]));
  return svg;
}

// ---- Line vs age (charcoal accumulation) ----
function chartLineAge(ds){
  const names=Object.keys(ds.series);
  const W=760,H=440,m={l:64,r:20,t:20,b:48};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const [amn,amx]=extent(ds.ages);
  let all=[]; names.forEach(n=>all=all.concat(ds.series[n]));
  const [vmn0,vmx]=extent(all); const vmn=Math.min(0,vmn0);
  const sx=a=>m.l+(a-amn)/(amx-amn||1)*iw;
  const sy=v=>m.t+ih-(v-vmn)/(vmx-vmn||1)*ih;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-height:70vh'});
  axesXY(svg,m,iw,ih,amn,amx,vmn,vmx,'Age (cal yr BP)',ds.unit||'value');
  names.forEach((n,si)=>{
    let p=''; ds.ages.forEach((a,i)=>{const v=ds.series[n][i];if(v==null||a==null||isNaN(a))return;p+=(p?'L':'M')+sx(a).toFixed(1)+' '+sy(v).toFixed(1)+' ';});
    svg.appendChild(el('path',{d:p,fill:'none',stroke:pal(si),'stroke-width':2}));
  });

}

// ---- Dating points (Bacon input): X=age, Y=depth inverted, error bars ----
function chartDates(ds){
  const pts=ds.points.filter(p=>p.age!=null&&p.depth!=null);
  const W=760,H=480,m={l:70,r:20,t:24,b:48}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const ages=pts.map(p=>p.age), errs=pts.map(p=>p.error||0);
  const amn=Math.min(...ages.map((a,i)=>a-(errs[i]||0))), amx=Math.max(...ages.map((a,i)=>a+(errs[i]||0)));
  const [dmn,dmx]=extent(pts.map(p=>p.depth));
  const sx=a=>m.l+(a-amn)/(amx-amn||1)*iw, sy=d=>m.t+(d-dmn)/(dmx-dmn||1)*ih;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-height:70vh'});
  axes(svg,m,iw,ih,amn,amx,dmn,dmx,'Age (cal yr BP / model input)','Depth (cm)');
  pts.forEach((p,i)=>{
    const y=sy(p.depth), e=p.error||0;
    if(e){ svg.appendChild(el('line',{x1:sx(p.age-e),y1:y,x2:sx(p.age+e),y2:y,stroke:pal(0),'stroke-width':1.5,opacity:.6})); }
    const c=el('circle',{cx:sx(p.age).toFixed(1),cy:y.toFixed(1),r:4,fill:pal(0),stroke:'#fff','stroke-width':1});
    c.addEventListener('mousemove',ev=>{const r=document.getElementById('vizChart').getBoundingClientRect();
      showTip(ev.clientX-r.left,ev.clientY-r.top,`<b>${esc(p.lab||'date')}</b><br>${p.depth} cm<br>${Math.round(p.age).toLocaleString()}${e?' ± '+Math.round(e):''} cal BP`);});
    c.addEventListener('mouseleave',hideTip); svg.appendChild(c);
  });
  const cap=el('text',{x:m.l,y:H-6,'font-size':10.5,fill:ink('--vmuted')||'#888'});cap.textContent=`${pts.length} dated points feeding the Bacon age model (error bars = ±1σ where available)`;svg.appendChild(cap);
  return svg;
}
// ---- generic line(s) vs age/depth ----
function chartLineAny(ds,site){
  const x = ds.ages || ds.depths; const xl = ds.ages?'Age (cal yr BP)':'Depth (cm)';
  const names=Object.keys(ds.series);
  const W=760,H=440,m={l:72,r:20,t:24,b:48}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const [xmn,xmx]=extent(x.filter(v=>v!=null));
  let all=[]; names.forEach(n=>all=all.concat(ds.series[n]));
  const [vmn0,vmx]=extent(all); const vmn=Math.min(0,vmn0);
  const sx=a=>m.l+(a-xmn)/(xmx-xmn||1)*iw, sy=v=>m.t+ih-(v-vmn)/(vmx-vmn||1)*ih;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'max-height:70vh'});
  axesXY(svg,m,iw,ih,xmn,xmx,vmn,vmx,xl,ds.unit||'value');
  names.forEach((n,si)=>{ let p='';
    x.forEach((a,i)=>{const val=ds.series[n][i]; if(val==null||a==null)return; p+=(p?'L':'M')+sx(a).toFixed(1)+' '+sy(val).toFixed(1)+' ';});
    svg.appendChild(el('path',{d:p,fill:'none',stroke:pal(si),'stroke-width':2}));
  });
  legend(svg,W,m,names.map((n,i)=>[n,pal(i)]));
  return svg;
}
// ---- Stratigraphic pollen diagram: small multiples, vertical = age/depth ----
function chartStrat(ds,site){
  const va=vaxis(ds,site); const yv=va.vals;
  const [dmn,dmx]=extent(yv.filter(x=>x!=null));
  let names=Object.keys(ds.series);
  names.sort((a,b)=>Math.max(...ds.series[b])-Math.max(...ds.series[a]));
  const MAXT=24; const shown=names.slice(0,MAXT);
  const colW=88, gap=6, m={l:66,t:20,b:60};
  const ih=460;
  const W=m.l+shown.length*(colW+gap)+20, H=m.t+ih+m.b;
  const sy=d=>m.t+(d-dmn)/(dmx-dmn||1)*ih;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'max-height:72vh'});
  svg.appendChild(el('line',{x1:m.l,y1:m.t,x2:m.l,y2:m.t+ih,stroke:ink('--vmuted')||'#888'}));
  niceTicks(dmn,dmx,6).forEach(d=>{ const y=sy(d);
    svg.appendChild(el('line',{x1:m.l-4,y1:y,x2:m.l,y2:y,stroke:ink('--vmuted')||'#888'}));
    const t=el('text',{x:m.l-7,y:y+3,'text-anchor':'end','font-size':10,fill:ink('--vmuted')||'#666'});t.textContent=fmt(d);svg.appendChild(t);
  });
  const yl=el('text',{x:14,y:m.t+ih/2,'font-size':11,fill:ink('--vmuted')||'#666',transform:`rotate(-90 14 ${m.t+ih/2})`,'text-anchor':'middle'});
  yl.textContent=va.label; svg.appendChild(yl);
  shown.forEach((n,ci)=>{
    const x0=m.l+ci*(colW+gap); const vmax=Math.max(...ds.series[n],1);
    const sx=v=>x0+ (v/vmax)*colW;
    const validYs=yv.map((d,i)=>[d,ds.series[n][i]]).filter(p=>p[0]!=null);
    if(!validYs.length)return;
    let up='M'+x0+' '+sy(validYs[0][0]).toFixed(1)+' ';
    validYs.forEach(p=>{ up+='L'+sx(p[1]).toFixed(1)+' '+sy(p[0]).toFixed(1)+' '; });
    up+='L'+x0+' '+sy(validYs[validYs.length-1][0]).toFixed(1)+' Z';
    svg.appendChild(el('path',{d:up,fill:pal(ci),opacity:.55,stroke:pal(ci),'stroke-width':1}));
    svg.appendChild(el('line',{x1:x0,y1:m.t,x2:x0,y2:m.t+ih,stroke:ink('--vline')||'#e5e5e5','stroke-width':1}));
    const t=el('text',{x:x0+2,y:m.t+ih+12,'font-size':10.5,fill:ink('--vink')||'#222',transform:`rotate(35 ${x0+2} ${m.t+ih+12})`});
    t.textContent=n.length>20?n.slice(0,19)+'\u2026':n; svg.appendChild(t);
    const s=el('text',{x:x0,y:m.t-6,'font-size':9,fill:ink('--vmuted')||'#999'});s.textContent=Math.round(vmax)+(ds.unit&&ds.unit.includes('%')?'%':''); svg.appendChild(s);
  });
  const note=names.length>MAXT?` (top ${MAXT} of ${names.length} taxa by abundance)`:'';
  const cap=el('text',{x:m.l,y:H-6,'font-size':10.5,fill:ink('--vmuted')||'#888'});cap.textContent='Each column scaled to its own maximum'+note; svg.appendChild(cap);
  return svg;
}

// axis for value(X)-depth(Y inverted)
function axes(svg,m,iw,ih,xmn,xmx,ymn,ymx,xl,yl){
  const c=ink('--vline')||'#e2e2e2', mut=ink('--vmuted')||'#777';
  svg.appendChild(el('line',{x1:m.l,y1:m.t,x2:m.l,y2:m.t+ih,stroke:mut}));
  svg.appendChild(el('line',{x1:m.l,y1:m.t+ih,x2:m.l+iw,y2:m.t+ih,stroke:mut}));
  niceTicks(xmn,xmx,6).forEach(v=>{const x=m.l+(v-xmn)/(xmx-xmn||1)*iw;
    svg.appendChild(el('line',{x1:x,y1:m.t,x2:x,y2:m.t+ih,stroke:c}));
    const t=el('text',{x,y:m.t+ih+16,'text-anchor':'middle','font-size':10,fill:mut});t.textContent=fmt(v);svg.appendChild(t);});
  niceTicks(ymn,ymx,6).forEach(v=>{const y=m.t+(v-ymn)/(ymx-ymn||1)*ih;
    svg.appendChild(el('line',{x1:m.l,y1:y,x2:m.l+iw,y2:y,stroke:c}));
    const t=el('text',{x:m.l-7,y:y+3,'text-anchor':'end','font-size':10,fill:mut});t.textContent=fmt(v);svg.appendChild(t);});
  const tx=el('text',{x:m.l+iw/2,y:m.t+ih+38,'text-anchor':'middle','font-size':11,fill:mut});tx.textContent=xl;svg.appendChild(tx);
  const ty=el('text',{x:16,y:m.t+ih/2,'font-size':11,fill:mut,'text-anchor':'middle',transform:`rotate(-90 16 ${m.t+ih/2})`});ty.textContent=yl;svg.appendChild(ty);
}
// axis for X-Y normal
function axesXY(svg,m,iw,ih,xmn,xmx,ymn,ymx,xl,yl){
  const c=ink('--vline')||'#e2e2e2', mut=ink('--vmuted')||'#777';
  svg.appendChild(el('line',{x1:m.l,y1:m.t,x2:m.l,y2:m.t+ih,stroke:mut}));
  svg.appendChild(el('line',{x1:m.l,y1:m.t+ih,x2:m.l+iw,y2:m.t+ih,stroke:mut}));
  niceTicks(xmn,xmx,6).forEach(v=>{const x=m.l+(v-xmn)/(xmx-xmn||1)*iw;
    svg.appendChild(el('line',{x1:x,y1:m.t,x2:x,y2:m.t+ih,stroke:c}));
    const t=el('text',{x,y:m.t+ih+16,'text-anchor':'middle','font-size':10,fill:mut});t.textContent=fmt(v);svg.appendChild(t);});
  niceTicks(ymn,ymx,6).forEach(v=>{const y=m.t+ih-(v-ymn)/(ymx-ymn||1)*ih;
    svg.appendChild(el('line',{x1:m.l,y1:y,x2:m.l+iw,y2:y,stroke:c}));
    const t=el('text',{x:m.l-7,y:y+3,'text-anchor':'end','font-size':10,fill:mut});t.textContent=fmt(v);svg.appendChild(t);});
  const tx=el('text',{x:m.l+iw/2,y:m.t+ih+38,'text-anchor':'middle','font-size':11,fill:mut});tx.textContent=xl;svg.appendChild(tx);
  const ty=el('text',{x:16,y:m.t+ih/2,'font-size':11,fill:mut,'text-anchor':'middle',transform:`rotate(-90 16 ${m.t+ih/2})`});ty.textContent=yl;svg.appendChild(ty);
}
function legend(svg,W,m,items){
  let x=m.l, y=12;
  items=items.filter((v,i,a)=>a.findIndex(z=>z[0]===v[0])===i);
  const g=el('g',{}); 
  items.forEach((it,i)=>{
    const gx=m.l+i*130;
    g.appendChild(el('rect',{x:gx,y:2,width:12,height:12,rx:3,fill:it[1]}));
    const t=el('text',{x:gx+17,y:12,'font-size':11,fill:ink('--vmuted')||'#555'});t.textContent=it[0];g.appendChild(t);
  });
  svg.insertBefore(g,svg.firstChild);
}
function fmt(v){v=+v;if(Math.abs(v)>=1000)return v.toLocaleString();return (Math.round(v*100)/100);}
function niceTicks(mn,mx,n){ if(mn===mx)return [mn]; const span=mx-mn,step0=span/n;
  const mag=Math.pow(10,Math.floor(Math.log10(step0))); const norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const start=Math.ceil(mn/step)*step; const t=[]; for(let v=start;v<=mx+1e-9;v+=step)t.push(Math.round(v*1e6)/1e6); return t; }

function toggleAxis(){ _axis = (_axis==='age'?'depth':'age');
  document.getElementById('vizToggleAxis').textContent = _axis==='age'?'Show vs depth':'Show vs age';
  const w=document.getElementById('vizTableWrap');
  if(w.style.display!=='none'){ w.innerHTML=buildTable(_cur.ds);} else { render(); } }

// table view
function toggleTable(){
  const w=document.getElementById('vizTableWrap'), ch=document.getElementById('vizChart'), b=document.getElementById('vizToggleTable');
  if(w.style.display==='none'){ w.innerHTML=buildTable(_cur.ds); w.style.display='block'; ch.style.display='none'; b.textContent='Chart view'; }
  else { w.style.display='none'; ch.style.display='block'; b.textContent='Table view'; }
}
function buildTable(ds){
  let cols, rows=[];
  if(ds.type==='chronology'){ cols=['depth (cm)','median','min','max','mean'];
    ds.depths.forEach((d,i)=>rows.push([d,ds.median[i],ds.min[i],ds.max[i],ds.mean?ds.mean[i]:'']));
  } else if(ds.xaxis==='age'){ const ns=Object.keys(ds.series); cols=['age (cal BP)'].concat(ns);
    ds.ages.forEach((a,i)=>rows.push([a].concat(ns.map(n=>ds.series[n][i]))));
  } else { const ns=Object.keys(ds.series); cols=['depth (cm)'].concat(ns);
    ds.depths.forEach((d,i)=>rows.push([d].concat(ns.map(n=>ds.series[n][i])))); }
  let h='<table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>h+='<tr>'+r.map(c=>`<td>${c==null?'':c}</td>`).join('')+'</tr>');
  return h+'</tbody></table>';
}
